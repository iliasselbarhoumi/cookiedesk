<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CookieDesk</title>
<link rel="stylesheet" href="../ui/panel.css">
<script type="module" src="../ui/panel.js"></script>
</head>
<body data-surface="popup">
<div class="app" data-testid="state" data-state="loading" data-view="main">
  <header class="top">
    <span class="brand" aria-hidden="true"><svg class="logo" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 3 3 0 0 1-3.5-3A3 3 0 0 1 14 5.5 3 3 0 0 1 12 3z"/><path d="M8.5 10.5h.01M15.5 15h.01M10 16h.01M12 12.5h.01"/></svg></span>
    <div class="ident">
      <h1 class="site">CookieDesk</h1>
      <span class="count" data-testid="count" aria-live="polite"></span>
    </div>
    <button type="button" class="icon-btn undo" data-testid="undo-last" disabled title="Nothing to undo" data-i18n-title="undo_nothing">
      <svg class="icon" data-icon="undo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="undo-label sr-only" data-i18n="undo">Undo</span>
    </button>
    <button type="button" class="icon-btn heart" data-testid="support-heart" title="Support CookieDesk on Ko-fi" aria-label="Support CookieDesk on Ko-fi" data-i18n-title="support_title" data-i18n-aria="support_title">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>
    </button>
    <button type="button" class="icon-btn primary add" data-testid="add-cookie" title="Add a cookie (n)" aria-label="Add a cookie" data-i18n-title="add_cookie_title" data-i18n-aria="add_cookie">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="icon-btn" data-testid="menu" popovertarget="menu" aria-haspopup="menu" aria-label="More actions" title="More actions" data-i18n-aria="more_actions" data-i18n-title="more_actions">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
    </button>
    <div id="menu" class="menu" popover role="menu" aria-label="More actions" data-i18n-aria="more_actions">
      <div class="tiles" role="group" aria-label="Export and import" data-i18n-aria="menu_group_transfer">
        <button type="button" role="menuitem" class="tile" data-icon="braces" data-testid="export-json" data-needs="ready" title="Export as JSON" data-i18n-title="export_json_title">JSON</button>
        <button type="button" role="menuitem" class="tile" data-icon="fileText" data-testid="export-netscape" data-needs="ready" title="Export as Netscape cookies.txt" data-i18n-title="export_txt_title">.txt</button>
        <button type="button" role="menuitem" class="tile" data-icon="code" data-testid="export-snippet" data-needs="ready" title="Copy as a document.cookie snippet" data-i18n-title="tile_snippet_title" data-i18n="tile_snippet">Snippet</button>
        <button type="button" role="menuitem" class="tile" data-icon="upload" data-testid="import" data-needs="ready" title="Import JSON or cookies.txt" data-i18n-title="tile_import_title" data-i18n="tile_import">Import</button>
      </div>
      <div class="tiles" role="group" aria-label="Cookie sets" data-i18n-aria="menu_group_sets">
        <button type="button" role="menuitem" class="tile" data-icon="bookmark" data-testid="save-set" data-needs="ready" title="Save these cookies as a named set file" data-i18n-title="tile_save_set_title" data-i18n="tile_save_set">Save set</button>
        <button type="button" role="menuitem" class="tile" data-icon="history" data-testid="restore-set" data-needs="ready" title="Restore a saved set (preview first)" data-i18n-title="tile_restore_title" data-i18n="tile_restore">Restore</button>
        <button type="button" role="menuitem" class="tile" data-icon="compare" data-testid="compare-set" data-needs="ready" title="Compare a saved set with now, or two sets" data-i18n-title="tile_compare_title" data-i18n="tile_compare">Compare</button>
        <button type="button" role="menuitem" class="tile" data-icon="layers" data-testid="copy-store" data-needs="ready" title="Copy the shown cookies to another store (normal ↔ incognito)" data-i18n-title="tile_copy_to_title" data-i18n="tile_copy_to" hidden>Copy to…</button>
      </div>
      <hr>
      <button type="button" role="menuitem" data-icon="trash" data-testid="bulk-delete" data-needs="ready" class="danger" data-i18n="menu_bulk_delete">Delete shown cookies…</button>
      <hr>
      <button type="button" role="menuitem" data-icon="sliders" data-testid="open-access" data-i18n="menu_access">Access &amp; settings</button>
      <button type="button" role="menuitem" data-icon="keyboard" data-testid="shortcuts"><span data-i18n="menu_shortcuts">Shortcuts</span> <kbd>?</kbd></button>
      <button type="button" role="menuitem" data-icon="panel" data-testid="open-sidepanel" class="popup-only" data-i18n="menu_sidepanel">Open in side panel</button>
      <hr>
      <button type="button" role="menuitem" data-icon="star" data-testid="menu-rate" class="rate" data-i18n="menu_rate" hidden>Rate CookieDesk</button>
      <button type="button" role="menuitem" data-icon="coffee" data-testid="menu-support" class="kofi" data-i18n="menu_support">Support on Ko-fi</button>
    </div>
    <input type="file" data-testid="import-file" accept=".json,.txt,application/json,text/plain" hidden>
    <input type="file" data-testid="restore-file" accept=".json,application/json" hidden>
    <input type="file" data-testid="compare-file" accept=".json,application/json" multiple hidden>
  </header>
  <div class="tools">
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/><path d="M20 20l-4-4"/></svg>
      <input type="search" data-testid="search" placeholder="Search cookies" aria-label="Filter cookies by name, value or domain" title="Filter by name, value or domain" data-i18n-placeholder="search_placeholder" data-i18n-aria="search_label" data-i18n-title="search_title" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <label class="store" title="Cookie store" data-i18n-title="cookie_store" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18M6 11l2-6h8l2 6"/><path d="M7 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM17 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM10 16h4"/></svg>
      <select data-testid="store-select" aria-label="Cookie store" data-i18n-aria="cookie_store" hidden></select>
    </label>
  </div>
  <main class="main"></main>
  <dialog class="dialog" data-testid="confirm">
    <form method="dialog">
      <div class="dialog-head">
        <span class="dialog-glyph" hidden></span>
        <h2 class="dialog-title"></h2>
      </div>
      <p class="dialog-message" data-testid="confirm-message"></p>
      <div class="dialog-body"></div>
      <div class="dialog-actions">
        <button type="submit" class="btn" value="cancel" data-testid="confirm-cancel" data-i18n="btn_cancel">Cancel</button>
        <button type="submit" class="btn primary" value="ok" data-testid="confirm-ok" data-i18n="btn_ok">OK</button>
      </div>
    </form>
  </dialog>
</div>
</body>
</html>
