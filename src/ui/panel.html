<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CookieDesk</title>
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body data-surface="panel">
<div class="app" data-testid="state" data-state="loading" data-view="main">
  <header class="top">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 3 3 0 0 1-3.5-3A3 3 0 0 1 14 5.5 3 3 0 0 1 12 3z"/><path d="M8.5 10.5h.01M15.5 15h.01M10 16h.01M12 12.5h.01"/></svg>
    <div class="ident">
      <h1 class="site">CookieDesk</h1>
      <span class="count" data-testid="count" aria-live="polite"></span>
    </div>
    <button type="button" class="btn undo" data-testid="undo-last" disabled title="Nothing to undo">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="undo-label">Undo</span>
    </button>
    <button type="button" class="btn primary add" data-testid="add-cookie" title="Add a cookie">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
    </button>
    <button type="button" class="icon-btn" data-testid="menu" popovertarget="menu" aria-haspopup="menu" aria-label="More actions" title="More actions">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
    </button>
    <div id="menu" class="menu" popover role="menu" aria-label="More actions">
      <button type="button" role="menuitem" data-testid="export-json" data-needs="ready">Export JSON…</button>
      <button type="button" role="menuitem" data-testid="export-netscape" data-needs="ready">Export cookies.txt…</button>
      <button type="button" role="menuitem" data-testid="import" data-needs="ready">Import…</button>
      <hr>
      <button type="button" role="menuitem" data-testid="open-access">Access &amp; settings</button>
      <button type="button" role="menuitem" data-testid="open-sidepanel" class="popup-only">Open in side panel</button>
    </div>
    <input type="file" data-testid="import-file" accept=".json,.txt,application/json,text/plain" hidden>
  </header>
  <div class="tools">
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/><path d="M20 20l-4-4"/></svg>
      <input type="search" data-testid="search" placeholder="Filter by name, value or domain" aria-label="Filter cookies" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <select data-testid="store-select" aria-label="Cookie store" hidden></select>
  </div>
  <main class="main"></main>
  <dialog class="dialog" data-testid="confirm">
    <form method="dialog">
      <h2 class="dialog-title"></h2>
      <p class="dialog-message" data-testid="confirm-message"></p>
      <div class="dialog-body"></div>
      <div class="dialog-actions">
        <button type="submit" class="btn" value="cancel" data-testid="confirm-cancel">Cancel</button>
        <button type="submit" class="btn primary" value="ok" data-testid="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>
</div>
</body>
</html>
